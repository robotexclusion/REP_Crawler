[project]
name = "rep-crawler"
version = "0.1.0"
description = "Crawls domains in the TRANCO list to find implementations of Robots Exclusion Protocol"
readme = "README.md"
authors = [
    { name = "robot"}
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.3",
]

[project.scripts]
rep-crawler = "rep_crawler:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
